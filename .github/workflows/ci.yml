name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs of the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # An application runs on one Node version (the one in .nvmrc and the
      # Dockerfile), so there is no version matrix as a library would need.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # A single script — the same one contributors run locally — so the gates
      # can never drift between CI and the docs. It chains, in order: lint,
      # markdown lint, format check, typecheck, knip, unit tests with coverage
      # thresholds, build and e2e tests against the build.
      - name: Verify
        run: pnpm verify

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One browser is enough here: this job tests the image (nginx routing,
      # caching and security headers), not cross-browser behaviour.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build image
        run: docker build --tag webapp:ci .

      - name: Start container
        run: |
          docker run --detach --publish 8080:8080 webapp:ci
          curl --silent --fail --retry 10 --retry-all-errors --retry-delay 1 --output /dev/null http://localhost:8080/

      - name: E2E tests against the image
        run: pnpm test:e2e --project=chromium
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-docker
          path: playwright-report/
          retention-days: 14
