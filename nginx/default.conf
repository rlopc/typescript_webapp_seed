# Serves the Vite build as a single-page application.
server {
    # The unprivileged image cannot bind ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the nginx version in headers and error pages.
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets/ (the hash is in the file
    # name), so a URL never changes content: cache it for a year. A missing
    # asset is a real 404, never the SPA shell.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else falls back to index.html, so client-side routes such as
    # /status work on a direct visit or a reload. `no-cache` makes browsers
    # revalidate it, so a new deployment is picked up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
