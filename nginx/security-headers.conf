# Included in every `location`: nginx drops the server-level `add_header`
# directives in any block that declares its own, so they cannot live there.
# HSTS is not set here: it belongs to whatever terminates TLS in front of this
# container.

# Only same-origin code, styles and API calls. If the API lives on another
# origin, add it to `connect-src`.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
